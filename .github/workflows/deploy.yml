name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: FIT5032-Lab5/package-lock.json

      - name: Install dependencies
        working-directory: FIT5032-Lab5
        run: npm ci

      - name: Build
        working-directory: FIT5032-Lab5
        run: npm run build

      - name: Add SPA fallback
        run: cp FIT5032-Lab5/dist/index.html FIT5032-Lab5/dist/404.html

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: FIT5032-Lab5/dist
